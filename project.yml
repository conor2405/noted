name: Noted

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.2"
  projectFormat: xcode16_3
  bundleIdPrefix: com.conor2405
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.16.0

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.0

targets:
  NotedApp:
    type: application
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: NotedApp/Sources
        optional: true
      - path: NotedApp/Resources
      - path: NotedApp/Configuration/iOS
        includes:
          - GoogleService-Info.plist
        buildPhase: resources
        destinationFilters:
          - iOS
      - path: NotedApp/Configuration/macOS
        includes:
          - GoogleService-Info.plist
        buildPhase: resources
        destinationFilters:
          - macOS
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: NotedApp/Configuration/iOS/NotedApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotedApp/Configuration/iOS/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        PRODUCT_BUNDLE_IDENTIFIER: com.conor2405.noted
        PRODUCT_MODULE_NAME: NotedApp
        PRODUCT_NAME: Noted
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": NotedApp/Configuration/macOS/NotedApp.entitlements
        "INFOPLIST_FILE[sdk=macosx*]": NotedApp/Configuration/macOS/Info.plist
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.conor2405.noted.macos
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "6"

  NotedAppTests:
    type: bundle.unit-test
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: NotedApp/Tests
        optional: true
    dependencies:
      - target: NotedApp
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.conor2405.noted.tests
        PRODUCT_MODULE_NAME: NotedAppTests
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.conor2405.noted.macos.tests

schemes:
  NotedApp:
    build:
      targets:
        NotedApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - NotedApp
      targets:
        - name: NotedAppTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
