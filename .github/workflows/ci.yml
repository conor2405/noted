name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Firebase backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  apple:
    name: iOS and macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Report tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate and build Apple targets
        run: make ci-apple
